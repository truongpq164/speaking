<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thử kết nối – Tiếng Anh Tư Duy</title>
<!-- Bước ① dự án Đăng ký – duyệt (10/10/2026): trang thử. Gọi máy chủ Apps Script /exec bằng fetch POST text/plain,
     KHÔNG gửi cookie Google (credentials:'omit'), không vé. Máy chủ trả "DANG_NHAP" = kết nối được.
     Mục đích: xem trình duyệt đăng nhập tài khoản Google dưới 13 tuổi có chặn trang/kết nối không. Xóa sau khi xong bước ①. -->
<style>
:root{color-scheme:light}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F4F6F8;color:#1A1B2A;font:15px/1.5 "Be Vietnam Pro","Segoe UI",system-ui,sans-serif;padding:16px;box-sizing:border-box}
.hop{background:#fff;border-radius:22px;padding:28px 32px;max-width:460px;width:100%;text-align:center;box-shadow:0 1px 2px #1a1b2a0d,0 12px 40px #1a1b2a0f}
.vong{width:58px;height:58px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;font-size:26px;font-weight:800;background:#FFF4DC;color:#8A5A00}
.ok .vong{background:#E3F4E6;color:#1F6B33}
.loi .vong{background:#FDECEC;color:#C62828}
.hop b{display:block;font-size:20px}
.hop p{margin:8px 0 0;color:#4A4C58;font-size:14px}
.ct{margin-top:14px;font-size:12px;color:#5F6787;text-align:left;background:#F6F7F9;border-radius:14px;padding:10px 12px;word-break:break-word}
button{margin-top:16px;font:inherit;font-weight:700;font-size:14px;border:0;border-radius:14px;padding:11px 18px;background:#D9690F;color:#fff;cursor:pointer}
button:focus-visible{outline:2px solid #1A1B2A;outline-offset:2px}
.logo{margin-top:14px;color:#E8771A;font-weight:800;font-size:13px;letter-spacing:.04em}
</style>
</head>
<body>
<div class="hop" id="hop" role="status" aria-live="polite">
  <div class="vong" id="vong">…</div>
  <b id="tt">Đang thử kết nối…</b>
  <p id="mt">Trang đã mở được. Đang gọi máy chủ.</p>
  <div class="ct" id="ct"></div>
  <button type="button" id="lai">Thử lại</button>
  <div class="logo">TIẾNG ANH TƯ DUY</div>
</div>
<script>
(function () {
  'use strict';
  var EXEC = 'https://script.google.com/macros/s/AKfycbyo-tmNmQm-VOGJ7ptmbE5aAwCQhBrBDJSmgdIgme0pfdvLtadA6tdeoEZhH5gLVbXpRA/exec';
  var $ = function (id) { return document.getElementById(id); };
  function ket(loai, tieuDe, moTa, chiTiet) {
    $('hop').className = 'hop ' + loai;
    $('vong').textContent = loai === 'ok' ? '✓' : '!';
    $('tt').textContent = tieuDe; $('mt').textContent = moTa; $('ct').textContent = chiTiet;
  }
  function thu() {
    $('hop').className = 'hop'; $('vong').textContent = '…';
    $('tt').textContent = 'Đang thử kết nối…'; $('mt').textContent = 'Trang đã mở được. Đang gọi máy chủ.'; $('ct').textContent = '';
    var t0 = Date.now();
    var hetGio = new Promise(function (ok, ko) { setTimeout(function () { ko(new Error('quá 40 giây')); }, 40000); });
    Promise.race([fetch(EXEC, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn: 'trangPhong', args: [], tok: '' }) })
      .then(function (r) { if (!r.ok) throw new Error('máy chủ trả mã ' + r.status); return r.text(); }), hetGio])
      .then(function (txt) {
        var ms = Date.now() - t0, j = null;
        try { j = JSON.parse(txt); } catch (e) { /* không phải JSON */ }
        var ct = 'Thời gian: ' + ms + ' ms · Máy chủ trả: ' + txt.slice(0, 120) + '\nTrình duyệt: ' + navigator.userAgent;
        if (j && j.err && /^DANG_NHAP/.test(String(j.err))) ket('ok', 'KẾT NỐI ĐƯỢC', 'Trang và máy chủ đều chạy trên trình duyệt này. Thầy chụp màn hình gửi em.', ct);
        else ket('loi', 'Máy chủ trả lời lạ', 'Có kết nối nhưng câu trả lời không như dự kiến. Thầy chụp màn hình gửi em.', ct);
      })
      .catch(function (e) {
        ket('loi', 'CHƯA KẾT NỐI ĐƯỢC', 'Trang mở được nhưng không gọi được máy chủ. Thầy chụp màn hình gửi em.',
          'Lỗi: ' + e.message + ' · sau ' + (Date.now() - t0) + ' ms\nTrình duyệt: ' + navigator.userAgent);
      });
  }
  $('lai').onclick = thu;
  thu();
})();
</script>
</body>
</html>
