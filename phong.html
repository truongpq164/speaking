<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luyện nói Speaking – Tiếng Anh Tư Duy</title>
<!-- v3.5.1 (09/10/2026) Trang vỏ phòng luyện – đặt trên GitHub Pages để phòng có LINK THẬT:
     bấm Refresh / F5 luôn mở lại đúng phòng (cách cũ dùng địa chỉ blob: chết khi tab trang chủ đóng/tải lại/ngủ).
     Mỗi lần mở: lấy mẫu trang mới nhất từ máy chủ Apps Script (API trangPhong) rồi dựng phòng. Vé đăng nhập giữ trong tab (sessionStorage). -->
<style>
:root{color-scheme:light}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F4F6F8;color:#1A1B2A;font:15px/1.5 "Be Vietnam Pro","Segoe UI",system-ui,sans-serif;padding:16px;box-sizing:border-box}
.hop{background:#fff;border-radius:22px;padding:28px 32px;max-width:440px;width:100%;text-align:center;box-shadow:0 1px 2px #1a1b2a0d,0 12px 40px #1a1b2a0f}
.vong{width:36px;height:36px;border:4px solid #FFE4D6;border-top-color:#E8771A;border-radius:50%;margin:0 auto 14px;animation:q .9s linear infinite}
@keyframes q{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.vong{animation:none}}
.hop b{display:block;font-size:17px}
.hop p{margin:8px 0 0;color:#4A4C58;font-size:14px}
.logo{margin-top:14px;color:#E8771A;font-weight:800;font-size:13px;letter-spacing:.04em}
.nut{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.nut button,.nut a{font-weight:700;font-size:14px;font-family:inherit;border-radius:14px;padding:11px 18px;cursor:pointer;text-decoration:none}
.chinh{background:#D9690F;color:#fff;border:0}
.phu{background:#fff;color:#1A1B2A;border:1px solid #E3E5EA}
.loi b{color:#C62828}
</style>
</head>
<body>
<div class="hop" id="hop" role="status"><div class="vong"></div><b>Đang mở phòng luyện…</b><p>Lần đầu có thể mất vài giây.</p><div class="logo">TIẾNG ANH TƯ DUY</div></div>
<script>
(function () {
  'use strict';
  var EXEC = 'https://script.google.com/macros/s/AKfycbyo-tmNmQm-VOGJ7ptmbE5aAwCQhBrBDJSmgdIgme0pfdvLtadA6tdeoEZhH5gLVbXpRA/exec';
  var KHO = 'sp_mau';   // mẫu trang lưu trong tab: chuyển phần mở ngay, không phải tải lại
  function lay(k) { try { return sessionStorage.getItem(k) || localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function dat(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { /* bỏ qua */ } try { localStorage.setItem(k, v); } catch (e) { /* bỏ qua */ } }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function loi(msg) {
    var hop = document.getElementById('hop');
    hop.className = 'hop loi';
    hop.innerHTML = '<b>Chưa mở được phòng luyện</b><p>' + esc(msg) + '</p><div class="nut"><button class="chinh" id="thuLai">Thử lại</button><a class="phu" href="' + EXEC + '">Về trang chủ</a></div><div class="logo">TIẾNG ANH TƯ DUY</div>';
    document.getElementById('thuLai').onclick = function () { location.reload(); };
  }
  var q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.slice(1));
  var tok = h.get('t');
  if (tok) { dat('sp_tok', tok); history.replaceState(null, '', location.pathname + location.search); }   // không để vé nằm trên thanh địa chỉ
  else tok = lay('sp_tok');
  var p = q.get('p') === 'app' ? 'app' : 'luyen', m = q.get('m') || (p === 'app' ? 'thi' : 'chude');
  if (!tok) return loi('Em mở phòng từ trang chủ Luyện nói Speaking (bấm VÀO LUYỆN) nhé.');

  function dung(P) {
    var mau = JSON.stringify({ luyen: P.luyen, app: P.app }).replace(/</g, '\\u003c');
    // Giống trang chủ: thay vé + chế độ TRƯỚC, nhúng mẫu SAU (mẫu nhúng giữ nguyên chỗ đánh dấu cho lần chuyển phần sau)
    // v3.5.1: thoát '<' để link có thẻ đóng script trong ?m= hoặc #t= không chèn được mã vào trang phòng (giám sát độc lập 09/10/2026)
    var js = function (x) { return JSON.stringify(x).replace(/</g, '\\u003c'); };
    var html = P[p].split("'__TOK__'").join(js(tok)).split("'__MODE__'").join(js(m)).split("'__PAGES__'").join(mau);
    html = html.replace(/<head>/i, '<head><script>window.__spVo=1;<\/script>');   // báo cho thanh chuyển phần: đang chạy trên link thật
    document.open(); document.write(html); document.close();
  }
  var nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {};
  var c = null;
  if (nav.type !== 'reload') { try { c = JSON.parse(sessionStorage.getItem(KHO) || 'null'); } catch (e) { c = null; } }
  if (c && c.luyen && c.app) return dung(c);   // chuyển phần: dùng mẫu đã có; bấm Refresh: luôn lấy bản mới nhất

  var hetGio = new Promise(function (ok, ko) { setTimeout(function () { ko(new Error('máy chủ trả lời quá 40 giây')); }, 40000); });
  Promise.race([fetch(EXEC, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'trangPhong', args: [], tok: tok }) })
    .then(function (r) { if (!r.ok) throw new Error('máy chủ trả lỗi ' + r.status); return r.json(); }), hetGio])
    .then(function (j) {
      if (j.err) { var e = new Error(String(j.err).replace(/^(DANG_NHAP|CHUA_CO): /, '')); e.dn = /^(DANG_NHAP|CHUA_CO)/.test(j.err); throw e; }
      try { sessionStorage.setItem(KHO, JSON.stringify(j.res)); } catch (e) { /* đầy bộ nhớ thì thôi */ }
      dung(j.res);
    })
    .catch(function (e) {
      if (e.dn) return loi(e.message + ' Em về trang chủ đăng nhập lại rồi bấm VÀO LUYỆN nhé.');
      loi('Chưa kết nối được máy chủ (' + e.message + '). Em kiểm tra mạng rồi bấm Thử lại.');
    });
})();
</script>
</body>
</html>
